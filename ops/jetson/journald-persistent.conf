# Installed as /etc/systemd/journald.conf.d/persistent.conf on node2 and node3.
#
# Why: by default these Jetsons keep the journal in /run (volatile), so after a reboot the
# PREVIOUS boot's log is gone and `journalctl -b -1` returns nothing. That is exactly what
# blocked attributing the ~199 s pre-Linux portion of a reboot (A43) between OS shutdown and
# Tegra firmware. With this in place that log survives the reboot.
#
#   sudo mkdir -p /etc/systemd/journald.conf.d /var/log/journal
#   sudo install -m 644 -o root -g root journald-persistent.conf \
#        /etc/systemd/journald.conf.d/persistent.conf
#   sudo systemd-tmpfiles --create --prefix /var/log/journal
#   sudo journalctl --flush && sudo systemctl restart systemd-journald
#
# The flush matters: setting Storage=persistent and restarting journald is NOT enough on its
# own -- /var/log/journal/<machine-id>/ stays empty until the journal is flushed out of /run.
# Verify with: find /var/log/journal -name '*.journal' | wc -l   (must be > 0)
#
# Capped on purpose. An uncapped persistent journal is a slow disk leak, and this repo has
# already lost a gaming session on another board to a full root filesystem.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
